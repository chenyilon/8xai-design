name: Linux MCP checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -r requirements.txt
      - run: node scripts/smoke-test.mjs python -m xai_mcp.server
      - run: docker build -t 8xai-design:test .
      - run: node scripts/smoke-test.mjs docker run --rm -i 8xai-design:test
